[EdgeProtection]
; Enable edge protection for attack animations.
bEnableForAttackAnimations=true
; Allow the optional TrueHUD V3 API to draw ledge probes.
bDebugDraw=true
; Skyrim world units above the predicted destination where the ray begins.
fRaycastStartHeight=50.0
; Skyrim world units cast downward from the predicted destination.
fRaycastDownwardRange=200.0
; Ignore extremely small per-frame horizontal steps.
fMinimumHorizontalDelta=0.10

[MotionWarping]
; Enable default motion warping for attack animations.
; Explicit "animwarp" segments enable warping regardless of this setting.
bEnableForAttackAnimations=true
; Default scale limits for attack animations with no warp-control annotations.
fDefaultMinimumScale=0.0
fDefaultMaximumScale=1.0
; Default maximum authored-motion-to-target angle for unannotated attacks.
fDefaultMaximumAngleDegrees=60.0
; Stop this many Skyrim units short of the target. Zero targets the exact position.
fStopDistance=0.0
; Ignore animations whose authored horizontal motion is shorter than this.
fMinimumAuthoredDistance=1.0

[Debug]
uLogLevel=4
